<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Weekly Sim</title><style>
:root{--bg:#0b0f17;--card:#141b27;--line:#243044;--tx:#e8edf5;--mu:#8b98ad;--ac:#22c55e;--hm:#3b82f6;--aw:#f97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 16px 8px;background:linear-gradient(135deg,#0f2a1a,#0b0f17)}h1{margin:0;font-size:22px}h1 b{color:var(--ac)}.sub{color:var(--mu);font-size:13px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px}
nav button.on{background:var(--ac);color:#04130a;border-color:var(--ac)}main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mt{font-size:18px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0;font-size:12px;font-weight:700}.bar div{display:flex;align-items:center;padding:0 6px}
.a{background:var(--aw)}.h{background:var(--hm);justify-content:flex-end}.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.kv div{background:#0f1520;border-radius:8px;padding:6px 8px}
.kv span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.note{background:#3a1d0b;border:1px solid #7c3a10;color:#fdba74;border-radius:10px;padding:10px;margin-bottom:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-size:12px;font-weight:600;padding:6px;border-bottom:1px solid var(--line);background:var(--card)}
td{padding:7px 6px;border-bottom:1px solid var(--line)}td.n{text-align:right;white-space:nowrap}tr.v td{background:#0f2f1c}.pill{background:var(--ac);color:#04130a;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
h3{margin:0 0 8px;font-size:16px}.tw{overflow-x:auto}input,select{width:100%;background:#0f1520;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;margin-bottom:8px}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}footer{color:var(--mu);font-size:12px;text-align:center;padding:20px}
</style></head><body><header><h1>NFL Sim <b id="wk"></b></h1><div class="sub" id="up"></div></header><nav id="nav"></nav><main id="m"></main>
<footer>10,000 simulations per game. Odds: DraftKings via The Odds API. Model leans, not locks. Lines move.</footer>
<script>
const D={"week": 6, "date": "2026-10-15", "days": "Thursday Oct 15", "updated": "Oct 16, 2026 11:42 AM UTC", "tabs": {"Games": {"h": ["Matchup", "Kickoff ET", "Weather", "Win % Away", "Win % Home", "Projected Score", "Spread (market)", "Total (market)", "Top First-TD Pick", "First-TD %"], "r": [["SEA @ DEN", "Thu 8:15 PM", "45\u00b0F, wind 5, rain 0%", 0.5759, 0.4241, "SEA 21-17 DEN", "DEN +2.5", 40.5, "Jaxon Smith-Njigba (SEA)", 0.173]]}, "Best Bets": {"h": ["Game", "Bet", "Odds", "Book Chance %", "Model Chance %", "Edge %"], "r": [["SEA @ DEN", "Sam Darnold Over 4.5 rush yds", -117, 0.5105, 0.6523, 0.0638], ["SEA @ DEN", "Troy Franklin Over 17.5 rec yds", -116, 0.5084, 0.639, 0.0588], ["SEA @ DEN", "RJ Harvey Over 13.5 rush yds", -115, 0.5063, 0.6128, 0.0479], ["SEA @ DEN", "Evan Engram Under 2.5 receptions", 117, 0.4351, 0.5373, 0.046], ["SEA @ DEN", "Cooper Kupp Over 20.5 rec yds", -116, 0.5084, 0.5912, 0.0372], ["SEA @ DEN", "Rashid Shaheed Over 19.5 rec yds", -115, 0.5063, 0.5775, 0.032], ["SEA @ DEN", "Courtland Sutton Over 32.5 rec yds", -110, 0.4958, 0.566, 0.0316]]}, "First TD": {"h": ["Game", "Player", "Team", "Model %", "DK Odds", "Fair Odds"], "r": [["SEA @ DEN", "Jaxon Smith-Njigba", "SEA", 0.173, 550, 478], ["SEA @ DEN", "AJ Barner", "SEA", 0.073, 1300, 1270], ["SEA @ DEN", "RJ Harvey", "DEN", 0.0693, 1400, 1343], ["SEA @ DEN", "Courtland Sutton", "DEN", 0.0682, 1200, 1366], ["SEA @ DEN", "Emanuel Wilson", "SEA", 0.0496, 600, 1916]]}, "2+ TDs": {"h": ["Game", "Player", "Team", "Model %", "DK Odds", "Book %", "Fair Odds", "Edge", "Value"], "r": [["SEA @ DEN", "Jaxon Smith-Njigba", "SEA", 0.1929, 650, 0.1333, 418, null, false], ["SEA @ DEN", "AJ Barner", "SEA", 0.046, 2800, 0.0345, 2074, null, false], ["SEA @ DEN", "RJ Harvey", "DEN", 0.0414, 3000, 0.0323, 2315, null, false], ["SEA @ DEN", "Courtland Sutton", "DEN", 0.0403, 2500, 0.0385, 2381, null, false], ["SEA @ DEN", "Emanuel Wilson", "SEA", 0.0228, 750, 0.1176, 4286, null, false]]}, "Player Projections": {"h": ["Player", "Team", "Game", "Stat", "Projection", "Range", "Line", "Over %"], "r": [["Bo Nix", "DEN", "SEA @ DEN", "Pass yds", 205.2, "135\u2013275", 199.5, 0.5094], ["J.K. Dobbins", "DEN", "SEA @ DEN", "Rush yds", 59.6, "32\u201388", 49.5, 0.5531], ["Jaylen Waddle", "DEN", "SEA @ DEN", "Rec yds", 54.1, "3\u2013105", 48.5, 0.5138], ["Courtland Sutton", "DEN", "SEA @ DEN", "Rec yds", 43.4, "20\u201366", 32.5, 0.566], ["Jaylen Waddle", "DEN", "SEA @ DEN", "Receptions", 4.0, "3\u20136", 4.5, 0.4422], ["Courtland Sutton", "DEN", "SEA @ DEN", "Receptions", 3.0, "2\u20135", 3.5, 0.4629], ["Sam Darnold", "SEA", "SEA @ DEN", "Pass yds", 242.8, "133\u2013356", 221.5, 0.5254], ["Emanuel Wilson", "SEA", "SEA @ DEN", "Rush yds", 41.0, "5\u201378", 66.5, 0.4347], ["J.Price", "SEA", "SEA @ DEN", "Rush yds", 38.7, "13\u201364", null, null], ["Jaxon Smith-Njigba", "SEA", "SEA @ DEN", "Rec yds", 111.9, "57\u2013166", 93.5, 0.5441], ["Jaxon Smith-Njigba", "SEA", "SEA @ DEN", "Receptions", 7.0, "5\u20139", 6.5, 0.5276]]}, "Injuries": {"h": ["Team", "Player", "Status", "Who Replaces"], "r": [["DEN", "P.Bryant", "IR", null]]}, "Anytime TD": {"h": ["Game", "Player", "Team", "DK Odds", "Book %", "Model %", "Fair Odds", "Edge", "Value"], "r": [["SEA @ DEN", "Jaxon Smith-Njigba", "SEA", 100, 0.5, 0.5529, -124, 0.0238, false], ["SEA @ DEN", "AJ Barner", "SEA", 295, 0.2532, 0.288, 247, 0.0157, false], ["SEA @ DEN", "RJ Harvey", "DEN", 310, 0.2439, 0.2731, 266, 0.0131, false], ["SEA @ DEN", "Courtland Sutton", "DEN", 265, 0.274, 0.2696, 271, -0.002, false], ["SEA @ DEN", "Emanuel Wilson", "SEA", 120, 0.4545, 0.2059, 386, -0.1119, false], ["SEA @ DEN", "J.K. Dobbins", "DEN", 190, 0.3448, 0.1939, 416, -0.0679, false]]}, "Track Record": {"summary": {"season": 2026, "w": 63, "l": 88, "p": 0, "units": -14.91, "roi": -0.09875205627897046, "n": 151, "ll_model": 0.6640123592910991, "ll_mkt": 0.6606678908679051}, "weeks": [[6, "5-2", 2.63, 0.3751286078572435], [5, "58-86", -17.54, -0.1217879218967031]], "last": [["SEA @ DEN", "Sam Darnold Over 4.5 rush yds", -117, "W", 0.85], ["SEA @ DEN", "Troy Franklin Over 17.5 rec yds", -116, "L", -1.0], ["SEA @ DEN", "RJ Harvey Over 13.5 rush yds", -115, "W", 0.87], ["SEA @ DEN", "Evan Engram Under 2.5 receptions", 117, "W", 1.17], ["SEA @ DEN", "Cooper Kupp Over 20.5 rec yds", -116, "W", 0.86], ["SEA @ DEN", "Rashid Shaheed Over 19.5 rec yds", -115, "W", 0.87], ["SEA @ DEN", "Courtland Sutton Over 32.5 rec yds", -110, "L", -1.0]], "last_week": 6, "pickem": [{"app": "Underdog", "n": 36, "hit": 0.5555555555555556, "be": 0.5345, "fmt": "2-pick Standard", "soft": 12, "tough": 6}, {"app": "PrizePicks", "n": 244, "hit": 0.3688524590163934, "be": 0.5421, "fmt": "6-pick Flex", "soft": 75, "tough": 142}]}}},T=D.tabs,$=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=v=>v==null?'—':Math.round(v*100)+'%',O=v=>v==null?'—':(v>0?'+':'')+Math.round(v),N=v=>v==null?'—':(+v).toFixed(v%1?1:0);
$('#wk').textContent='Week '+D.week;$('#up').textContent=(D.days||('Sunday '+D.date))+' · Updated '+D.updated;
function tbl(h,rows,fmt,cls){return '<div class="tw"><table><tr>'+h.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr class="'+(cls?cls(r):'')+'">'+r.slice(0,h.length).map((v,i)=>{const f=fmt[i];return f?'<td class="n">'+f(v)+'</td>':'<td>'+e(v)+'</td>'}).join('')+'</tr>').join('')+'</table></div>'}
function group(rows,fn){const m={};rows.forEach(r=>(m[r[0]]=m[r[0]]||[]).push(r));return Object.entries(m).map(([g,rs])=>'<div class="card"><h3>'+e(g)+'</h3>'+fn(rs)+'</div>').join('')}
const V={
Games(){return T.Games.r.map(r=>{const[mt,ko,wx,aw,hw,sc,sp,tot,ft,fp]=r;const[a,h]=mt.replace(' (neutral)','').split(' @ ');
return `<div class="card"><div class="row"><div class="mt">${e(mt)}</div><div class="mu">${e(ko)} ET</div></div><div class="mu">${e(wx)}</div>
<div class="bar"><div class="a" style="width:${aw*100}%">${e(a)} ${P(aw)}</div><div class="h" style="width:${hw*100}%">${P(hw)} ${e(h)}</div></div>
<div class="kv"><div><span>Projected score</span>${e(sc)}</div><div><span>Market spread / total</span>${e(sp)} · ${N(tot)}</div><div style="grid-column:1/3"><span>Top first-TD pick</span>${e(ft)} — ${P(fp)}</div></div></div>`}).join('')},
'Best Bets'(){return '<div class="note">Model leans, not locks. Lines move.</div><div class="card">'+tbl(['Game','Bet','Odds','Book','Model','Edge'],T['Best Bets'].r,[0,0,O,P,P,v=>'<span class="pill">'+P(v)+'</span>'])+'</div>'},
'First TD'(){return group(T['First TD'].r,rs=>tbl(['Player','Team','Model','DK','Fair'],rs.map(r=>r.slice(1)),[0,0,P,O,O]))},
'Anytime TD'(){return '<div class="mu" style="margin-bottom:8px">Green = believable value (3–8% edge, enough games).</div>'+group(T['Anytime TD'].r,rs=>tbl(['Player','Team','DK','Book','Model','Fair'],rs.map(r=>[r[1],r[2],r[3],r[4],r[5],r[6],r[8]]),[0,0,O,P,P,O],r=>r[6]?'v':''))},
'2+ TDs'(){return '<div class="mu" style="margin-bottom:8px">Chance a player scores 2 or more TDs. DK = posted Over 1.5 TDs price (— if not posted). Green = believable value (3–8% edge, enough games).</div>'+group(T['2+ TDs'].r,rs=>tbl(['Player','Team','Model','DK','Fair'],rs.map(r=>[r[1],r[2],r[3],r[4],r[6],r[8]]),[0,0,v=>v==null?'—':(v*100).toFixed(1)+'%',O,O],r=>r[5]?'v':''))},
'Player Projections'(){const R=T['Player Projections'].r,u=i=>[...new Set(R.map(r=>r[i]))].sort();
const opt=(id,l,a)=>`<select id="${id}"><option value="">${l}</option>${a.map(x=>`<option>${e(x)}</option>`).join('')}</select>`;
setTimeout(()=>{const go=()=>{const q=$('#q').value.toLowerCase(),t=$('#ft').value,s=$('#fs').value;
$('#pt').innerHTML=tbl(['Player','Team','Stat','Proj','Range','Line','Over %'],R.filter(r=>(!q||r[0].toLowerCase().includes(q))&&(!t||r[1]==t)&&(!s||r[3]==s)).map(r=>[r[0],r[1],r[3],r[4],r[5],r[6],r[7]]),[0,0,0,v=>Math.round(v),0,N,P])};
['q','ft','fs'].forEach(i=>$('#'+i).oninput=go);go()});
return `<div class="card"><input id="q" placeholder="Search player…"><div class="f">${opt('ft','All teams',u(1))}${opt('fs','All stats',u(3))}<span></span></div><div id="pt"></div></div>`},
'Track Record'(){const R=T['Track Record'],s=R.summary;if(!s)return '<div class="card">No graded weeks yet. Results post after each week\'s games are final (Tuesday).</div>';
const U=v=>(v>0?'+':'')+(+v).toFixed(2)+'u';
return `<div class="card"><h3>${s.season} Best Bets</h3><div class="kv"><div><span>Record</span>${s.w}-${s.l}${s.p?'-'+s.p:''}</div><div><span>Units (1u/bet)</span>${U(s.units)}</div><div><span>ROI</span>${s.roi==null?'—':(s.roi*100).toFixed(1)+'%'}</div><div><span>Bets graded</span>${s.n}</div></div><div class="mu">Game log-loss: model ${s.ll_model.toFixed(3)} vs market ${s.ll_mkt.toFixed(3)} (lower is better)</div>${s.clv_n?`<div class="mu">Closing-line value: ${(s.clv*100>0?'+':'')+(s.clv*100).toFixed(1)}% avg, beat the close on ${(s.beat_close*100).toFixed(0)}% of ${s.clv_n} bets</div>`:''}${s.shadow?`<div class="mu">Paused TD/longshot picks (not bet): ${s.shadow.w}-${s.shadow.l}, ${U(s.shadow.units)}</div>`:''}</div>`+(R.pickem?`<div class="card"><h3>Pick'em (More/Less vs app line)</h3>${R.pickem.map(p=>`<div class="mu"><b>${p.app}</b>: ${p.n?`${(p.hit*100).toFixed(1)}% of ${p.n} picks hit`:'no lines tracked yet'} · break-even ${(p.be*100).toFixed(1)}% (${p.fmt}, standard payouts)${p.n?` · app line softer than sportsbook ${p.soft}×, tougher ${p.tough}×`:''}</div>`).join('')}</div>`:'')+
'<div class="card"><h3>By week</h3>'+tbl(['Week','W-L','Units','ROI'],R.weeks,[0,0,v=>U(v),P])+'</div>'+
'<div class="card"><h3>Week '+R.last_week+' Best Bets</h3>'+tbl(['Game','Bet','Odds','Result','Units'],R.last,[0,0,O,0,v=>U(v)],r=>r[3]=='W'?'v':'')+'</div>'},
Injuries(){return '<div class="card">'+tbl(['Team','Player','Status','Who replaces'],T.Injuries.r,[])+'</div>'}};
const names=Object.keys(V);function show(n){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent==n));$('#m').innerHTML=V[n]();scrollTo(0,0)}
$('#nav').innerHTML=names.map(n=>`<button>${n}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.textContent));show('Games');
</script></body></html>
