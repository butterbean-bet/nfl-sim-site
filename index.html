<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Weekly Sim</title><style>
:root{--bg:#0b0f17;--card:#141b27;--line:#243044;--tx:#e8edf5;--mu:#8b98ad;--ac:#22c55e;--hm:#3b82f6;--aw:#f97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px 16px 8px;background:linear-gradient(135deg,#0f2a1a,#0b0f17)}h1{margin:0;font-size:22px}h1 b{color:var(--ac)}.sub{color:var(--mu);font-size:13px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{flex:none;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px}
nav button.on{background:var(--ac);color:#04130a;border-color:var(--ac)}main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mt{font-size:18px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0;font-size:12px;font-weight:700}.bar div{display:flex;align-items:center;padding:0 6px}
.a{background:var(--aw)}.h{background:var(--hm);justify-content:flex-end}.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.kv div{background:#0f1520;border-radius:8px;padding:6px 8px}
.kv span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.note{background:#3a1d0b;border:1px solid #7c3a10;color:#fdba74;border-radius:10px;padding:10px;margin-bottom:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-size:12px;font-weight:600;padding:6px;border-bottom:1px solid var(--line);background:var(--card)}
td{padding:7px 6px;border-bottom:1px solid var(--line)}td.n{text-align:right;white-space:nowrap}tr.v td{background:#0f2f1c}.pill{background:var(--ac);color:#04130a;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700}
h3{margin:0 0 8px;font-size:16px}.tw{overflow-x:auto}input,select{width:100%;background:#0f1520;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;margin-bottom:8px}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}footer{color:var(--mu);font-size:12px;text-align:center;padding:20px}
</style></head><body><header><h1>NFL Sim <b id="wk"></b></h1><div class="sub" id="up"></div></header><nav id="nav"></nav><main id="m"></main>
