Games(){const LN=(t,x)=>x?`<div style="grid-column:1/3"><span>${t} lean</span><b>${e(x.pick)}</b> · ${e(x.str)}<div class="mu">Model ${e(x.model)} vs market ${e(x.market)} · gap ${e(x.gap)}${x.gap==='Not available'?'':' pts'}</div></div>`:'';
return '<div class="mu" style="margin-bottom:8px">Spread &amp; total leans: the model blends heavily toward the market, so small gaps are not edges. Coin flip = under 1 pt, Slight lean = 1–2.5 pts, Lean = more than 2.5 pts.</div>'+T.Games.r.map(r=>{const[mt,ko,wx,aw,hw,sc,sp,tot,ft,fp,ln]=r;const L=ln||{};const[a,h]=mt.replace(' (neutral)','').split(' @ ');
return `<div class="card"><div class="row"><div class="mt">${e(mt)}</div><div class="mu">${e(ko)} ET</div></div><div class="mu">${e(wx)}</div>
<div class="bar"><div class="a" style="width:${aw*100}%">${e(a)} ${P(aw)}</div><div class="h" style="width:${hw*100}%">${P(hw)} ${e(h)}</div></div>
<div class="kv"><div><span>Projected score</span>${e(sc)}</div><div><span>Market spread / total</span>${e(sp)} · ${N(tot)}</div>${LN('Spread',L.sp)}${LN('Total',L.tot)}<div style="grid-column:1/3"><span>Top first-TD pick</span>${e(ft)} — ${P(fp)}</div></div></div>`}).join('')},
'Best Bets'(){return '<div class="note">Model leans, not locks. Lines move.</div><div class="card">'+tbl(['Game','Bet','Odds','Book','Model','Edge'],T['Best Bets'].r,[0,0,O,P,P,v=>'<span class="pill">'+P(v)+'</span>'])+'</div>'},
'First TD'(){return group(T['First TD'].r,rs=>tbl(['Player','Team','Model','DK','Fair'],rs.map(r=>r.slice(1)),[0,0,P,O,O]))},
'Anytime TD'(){return '<div class="mu" style="margin-bottom:8px">Green = believable value (3–8% edge, enough games).</div>'+group(T['Anytime TD'].r,rs=>tbl(['Player','Team','DK','Book','Model','Fair'],rs.map(r=>[r[1],r[2],r[3],r[4],r[5],r[6],r[8]]),[0,0,O,P,P,O],r=>r[6]?'v':''))},
'2+ TDs'(){return '<div class="mu" style="margin-bottom:8px">Chance a player scores 2 or more TDs. DK = posted Over 1.5 TDs price (— if not posted). Green = believable value (3–8% edge, enough games).</div>'+group(T['2+ TDs'].r,rs=>tbl(['Player','Team','Model','DK','Fair'],rs.map(r=>[r[1],r[2],r[3],r[4],r[6],r[8]]),[0,0,v=>v==null?'—':(v*100).toFixed(1)+'%',O,O],r=>r[5]?'v':''))},
'Player Projections'(){const R=T['Player Projections'].r,u=i=>[...new Set(R.map(r=>r[i]))].sort();
const opt=(id,l,a)=>`<select id="${id}"><option value="">${l}</option>${a.map(x=>`<option>${e(x)}</option>`).join('')}</select>`;
setTimeout(()=>{const go=()=>{const q=$('#q').value.toLowerCase(),t=$('#ft').value,s=$('#fs').value;
$('#pt').innerHTML=tbl(['Player','Team','Stat','Proj','Range','Line','Over %'],R.filter(r=>(!q||r[0].toLowerCase().includes(q))&&(!t||r[1]==t)&&(!s||r[3]==s)).map(r=>[r[0],r[1],r[3],r[4],r[5],r[6],r[7]]),[0,0,0,v=>Math.round(v),0,N,P])};
['q','ft','fs'].forEach(i=>$('#'+i).oninput=go);go()});
return `<div class="card"><input id="q" placeholder="Search player…"><div class="f">${opt('ft','All teams',u(1))}${opt('fs','All stats',u(3))}<span></span></div><div id="pt"></div></div>`},
'Track Record'(){const R=T['Track Record'],s=R.summary;if(!s)return '<div class="card">No graded weeks yet. Results post after each week\'s games are final (Tuesday).</div>';
const U=v=>(v>0?'+':'')+(+v).toFixed(2)+'u';
return `<div class="card"><h3>${s.season} Best Bets</h3><div class="kv"><div><span>Record</span>${s.w}-${s.l}${s.p?'-'+s.p:''}</div><div><span>Units (1u/bet)</span>${U(s.units)}</div><div><span>ROI</span>${s.roi==null?'—':(s.roi*100).toFixed(1)+'%'}</div><div><span>Bets graded</span>${s.n}</div></div><div class="mu">Game log-loss: model ${s.ll_model.toFixed(3)} vs market ${s.ll_mkt.toFixed(3)} (lower is better)</div>${s.clv_n?`<div class="mu">Closing-line value: ${(s.clv*100>0?'+':'')+(s.clv*100).toFixed(1)}% avg, beat the close on ${(s.beat_close*100).toFixed(0)}% of ${s.clv_n} bets</div>`:''}${s.shadow?`<div class="mu">Paused TD/longshot picks (not bet): ${s.shadow.w}-${s.shadow.l}, ${U(s.shadow.units)}</div>`:''}</div>`+(R.pickem?`<div class="card"><h3>Pick'em (More/Less vs app line)</h3>${R.pickem.map(p=>`<div class="mu"><b>${p.app}</b>: ${p.n?`${(p.hit*100).toFixed(1)}% of ${p.n} picks hit`:'no lines tracked yet'} · break-even ${(p.be*100).toFixed(1)}% (${p.fmt}, standard payouts)${p.n?` · app line softer than sportsbook ${p.soft}×, tougher ${p.tough}×`:''}</div>`).join('')}</div>`:'')+
'<div class="card"><h3>By week</h3>'+tbl(['Week','W-L','Units','ROI'],R.weeks,[0,0,v=>U(v),P])+'</div>'+
'<div class="card"><h3>Week '+R.last_week+' Best Bets</h3>'+tbl(['Game','Bet','Odds','Result','Units'],R.last,[0,0,O,0,v=>U(v)],r=>r[3]=='W'?'v':'')+'</div>'},
Injuries(){return '<div class="card">'+tbl(['Team','Player','Status','Who replaces'],T.Injuries.r,[])+'</div>'}};
const names=Object.keys(V);function show(n){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent==n));$('#m').innerHTML=V[n]();scrollTo(0,0)}
$('#nav').innerHTML=names.map(n=>`<button>${n}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.textContent));show('Games');
</script></body></html>
